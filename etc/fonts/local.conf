<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Rendering -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>

  <!-- Sans -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>IBM Plex Sans</family>
      <family>IBM Plex Sans Arabic</family>
      <family>IBM Plex Sans Devanagari</family>
      <family>IBM Plex Sans Hebrew</family>
      <family>IBM Plex Sans Korean</family>
      <family>IBM Plex Sans Chinese TC</family>
      <family>IBM Plex Sans Chinese SC</family>
      <family>IBM Plex Sans Thai</family>
      <family>IBM Plex Sans Thai Looped</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>

  <!-- interpreter version -->
  <match target="font">
    <edit name="truetype:interpreter-version" mode="assign">
      <int>40</int>
    </edit>
  </match>

  <!-- Serif -->
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>IBM Plex Serif</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Serif</family>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>

  <!-- Monospace -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>IBM Plex Mono</family>
      <family>Cascadia Code PL</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- Math -->
  <alias binding="strong">
    <family>math</family>
    <prefer>
      <family>IBM Plex Math</family>
    </prefer>
  </alias>

</fontconfig>
